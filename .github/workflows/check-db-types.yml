name: Check Supabase types

# Fails when src/types/database.ts has drifted from the live Supabase schema.
# Requires repo secrets:
#   SUPABASE_ACCESS_TOKEN — personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID   — project ref (the <project-ref> in the project URL)
#
# On first run after adding this workflow, regenerate and commit the file
# locally so the committed types match the live schema exactly:
#   npx supabase gen types typescript --project-id <ref> --schema public > src/types/database.ts

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/types/database.ts"
  schedule:
    - cron: "0 4 * * 1" # weekly, catches drift from manual DB changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate types from the live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript \
            --project-id "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --schema public \
            > /tmp/database.generated.ts

      - name: Diff against committed types
        run: |
          if ! diff -u src/types/database.ts /tmp/database.generated.ts; then
            echo "::error::src/types/database.ts is out of date with the live Supabase schema."
            echo "::error::Run: npx supabase gen types typescript --project-id <ref> --schema public > src/types/database.ts"
            exit 1
          fi
          echo "src/types/database.ts matches the live schema."
